<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dice Roller Game</title>

    <link rel="stylesheet" href="styles.css">

</head>

<body>

    <!-- PlayZone Home Button -->
    <a href="../index.html" class="playzone-home-btn" title="Back to PlayZone Home" style="position: fixed; top: 14px; right: 18px; z-index: 99999; background-color: #9a0002; color: #ffffff !important; padding: 8px 16px; border-radius: 30px; font-family: system-ui, -apple-system, sans-serif; font-weight: 700; font-size: 14px; text-decoration: none !important; display: inline-flex; align-items: center; gap: 6px; box-shadow: 0 4px 14px rgba(154, 0, 2, 0.35); border: 1.5px solid rgba(255, 255, 255, 0.3); transition: all 0.25s ease; line-height: 1;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
        <span>Home</span>
    </a>

    <!-- ================= NAVBAR ================= -->

    <nav class="navbar">
        <div class="logo">
            🎲 Dice Roller
        </div>
    </nav>

    <!-- ================= MAIN CONTAINER ================= -->
    
    <main class="container">
        <!-- Players -->

        <section class="players">

            <!-- USER -->

            <div class="player">

                <h2>User</h2>

                <div class="scene">

                    <div class="cube" id="userCube">

                        <div class="face front" data-num="1"></div>
                        <div class="face back" data-num="6"></div>
                        <div class="face right" data-num="2"></div>
                        <div class="face left" data-num="5"></div>
                        <div class="face top" data-num="3"></div>
                        <div class="face bottom" data-num="4"></div>

                    </div>

                </div>

                <div class="score-card">

                    <span>Current Roll</span>

                    <h3 id="userRoll">0</h3>

                </div>

                <div class="score-card">

                    <span>Total Score</span>

                    <h3 id="userTotal">0</h3>

                </div>

            </div>

            <!-- VS -->

            <div class="vs">

                VS

            </div>

            <!-- COMPUTER -->

            <div class="player">

                <h2>Computer</h2>

                <div class="scene">

                    <div class="cube" id="computerCube">

                        <div class="face front" data-num="1"></div>
                        <div class="face back" data-num="6"></div>
                        <div class="face right" data-num="2"></div>
                        <div class="face left" data-num="5"></div>
                        <div class="face top" data-num="3"></div>
                        <div class="face bottom" data-num="4"></div>

                    </div>

                </div>

                <div class="score-card">

                    <span>Current Roll</span>

                    <h3 id="computerRoll">0</h3>

                </div>

                <div class="score-card">

                    <span>Total Score</span>

                    <h3 id="computerTotal">0</h3>

                </div>

            </div>

        </section>

        <!-- Buttons -->

        <div class="buttons">

            <button id="rollBtn">

                🎲 Roll Dice

            </button>

            <button id="quitBtn">

                🔄 Reset Game

            </button>

        </div>

        <!-- Result -->

        <div class="result-box">

            <h2 id="result">

                Click "Roll Dice" to Start

            </h2>

        </div>

    </main>

    <script src="script.js"></script>

</body>

</html>
