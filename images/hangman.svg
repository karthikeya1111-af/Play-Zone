<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" width="100%" height="100%">
  <rect width="400" height="250" fill="#efe6dd" rx="12"/>
  
  <!-- Gallows -->
  <path d="M 100 200 L 220 200" stroke="#9a0002" stroke-width="8" stroke-linecap="round"/>
  <path d="M 140 200 L 140 50 L 240 50 L 240 75" stroke="#9a0002" stroke-width="8" stroke-linecap="round" fill="none"/>
  <path d="M 140 90 L 180 50" stroke="#9a0002" stroke-width="6" stroke-linecap="round"/>

  <!-- Hangman Figure (Classic vector artwork) -->
  <!-- Head -->
  <circle cx="240" cy="95" r="20" fill="#ffffff" stroke="#9a0002" stroke-width="5"/>
  <!-- Face eyes -->
  <circle cx="233" cy="92" r="2.5" fill="#9a0002"/>
  <circle cx="247" cy="92" r="2.5" fill="#9a0002"/>
  <!-- Smile -->
  <path d="M 233 102 Q 240 108 247 102" stroke="#9a0002" stroke-width="2.5" fill="none" stroke-linecap="round"/>

  <!-- Body -->
  <line x1="240" y1="115" x2="240" y2="160" stroke="#9a0002" stroke-width="5" stroke-linecap="round"/>
  <!-- Arms -->
  <line x1="240" y1="130" x2="215" y2="145" stroke="#9a0002" stroke-width="5" stroke-linecap="round"/>
  <line x1="240" y1="130" x2="265" y2="145" stroke="#9a0002" stroke-width="5" stroke-linecap="round"/>
  <!-- Legs -->
  <line x1="240" y1="160" x2="220" y2="190" stroke="#9a0002" stroke-width="5" stroke-linecap="round"/>
  <line x1="240" y1="160" x2="260" y2="190" stroke="#9a0002" stroke-width="5" stroke-linecap="round"/>

  <!-- Word Slots -->
  <g transform="translate(270, 100)">
    <line x1="0" y1="40" x2="20" y2="40" stroke="#9a0002" stroke-width="4"/>
    <text x="10" y="32" font-family="'Outfit', sans-serif" font-size="20" font-weight="bold" fill="#9a0002" text-anchor="middle">H</text>

    <line x1="28" y1="40" x2="48" y2="40" stroke="#9a0002" stroke-width="4"/>
    <text x="38" y="32" font-family="'Outfit', sans-serif" font-size="20" font-weight="bold" fill="#9a0002" text-anchor="middle">A</text>

    <line x1="56" y1="40" x2="76" y2="40" stroke="#9a0002" stroke-width="4"/>
    <text x="66" y="32" font-family="'Outfit', sans-serif" font-size="20" font-weight="bold" fill="#9a0002" text-anchor="middle">N</text>

    <line x1="84" y1="40" x2="104" y2="40" stroke="#9a0002" stroke-width="4"/>
    <text x="94" y="32" font-family="'Outfit', sans-serif" font-size="20" font-weight="bold" fill="#9a0002" text-anchor="middle">G</text>
  </g>
</svg>
