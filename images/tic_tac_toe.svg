<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" width="100%" height="100%">
  <rect width="400" height="250" fill="#efe6dd" rx="12"/>
  <!-- Grid -->
  <line x1="160" y1="50" x2="160" y2="200" stroke="#9a0002" stroke-width="6" stroke-linecap="round"/>
  <line x1="240" y1="50" x2="240" y2="200" stroke="#9a0002" stroke-width="6" stroke-linecap="round"/>
  <line x1="110" y1="100" x2="290" y2="100" stroke="#9a0002" stroke-width="6" stroke-linecap="round"/>
  <line x1="110" y1="150" x2="290" y2="150" stroke="#9a0002" stroke-width="6" stroke-linecap="round"/>
  
  <!-- X and O symbols -->
  <!-- Top Left X -->
  <line x1="125" y1="65" x2="145" y2="85" stroke="#9a0002" stroke-width="8" stroke-linecap="round"/>
  <line x1="145" y1="65" x2="125" y2="85" stroke="#9a0002" stroke-width="8" stroke-linecap="round"/>
  
  <!-- Center O -->
  <circle cx="200" cy="125" r="16" fill="none" stroke="#700001" stroke-width="7"/>
  
  <!-- Bottom Right X -->
  <line x1="255" y1="165" x2="275" y2="185" stroke="#9a0002" stroke-width="8" stroke-linecap="round"/>
  <line x1="275" y1="165" x2="255" y2="185" stroke="#9a0002" stroke-width="8" stroke-linecap="round"/>
  
  <!-- Winning line -->
  <line x1="120" y1="60" x2="280" y2="190" stroke="#c42b2e" stroke-width="4" stroke-linecap="round" stroke-dasharray="6,4"/>
</svg>
