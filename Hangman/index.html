<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Hangman Game - Play the classic word guessing game online on PlayZone!">
  <title>Hangman Challenge | PlayZone</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Fixed Top-Right Home Button -->
  <a href="../index.html" class="playzone-home-btn" title="Back to PlayZone Home">
    <i class="fa-solid fa-house"></i>
    <span>Home</span>
  </a>

  <!-- Header Navigation -->
  <header class="navbar">
    <div class="nav-container">
      <div class="logo">
        <i class="fa-solid fa-skull-crossbones"></i>
        <span>Hangman Challenge</span>
      </div>
    </div>
  </header>

  <!-- Main Game Container -->
  <main class="game-container">
    
    <!-- Top Stats Bar -->
    <div class="stats-bar">
      <div class="stat-box">
        <span class="stat-label">Category</span>
        <span class="stat-value" id="currentCategory">Animals</span>
      </div>

      <div class="stat-box">
        <span class="stat-label">Mistakes</span>
        <span class="stat-value" id="mistakesCount">0 / 6</span>
      </div>

      <div class="stat-box">
        <span class="stat-label">Score</span>
        <span class="stat-value" id="scoreDisplay">0</span>
      </div>

      <div class="stat-box">
        <span class="stat-label">Streak</span>
        <span class="stat-value" id="streakDisplay">🔥 0</span>
      </div>
    </div>

    <!-- Category Selector Buttons -->
    <div class="category-selector">
      <span class="selector-label">Categories:</span>
      <div class="category-pills">
        <button class="cat-btn active" data-category="animals">🦁 Animals</button>
        <button class="cat-btn" data-category="movies">🎬 Movies</button>
        <button class="cat-btn" data-category="tech">💻 Tech</button>
        <button class="cat-btn" data-category="sports">⚽ Sports</button>
        <button class="cat-btn" data-category="countries">🌍 Countries</button>
      </div>
    </div>

    <!-- Central Game Play Area -->
    <div class="play-area">
      
      <!-- Left: Hangman SVG Scaffold & Figure -->
      <div class="hangman-box">
        <svg id="hangmanSvg" viewBox="0 0 240 260" width="100%" height="100%">
          <!-- Base & Gallows -->
          <line x1="20" y1="240" x2="140" y2="240" stroke="#9a0002" stroke-width="6" stroke-linecap="round"/>
          <line x1="50" y1="240" x2="50" y2="20" stroke="#9a0002" stroke-width="6" stroke-linecap="round"/>
          <line x1="50" y1="20" x2="160" y2="20" stroke="#9a0002" stroke-width="6" stroke-linecap="round"/>
          <line x1="50" y1="60" x2="90" y2="20" stroke="#9a0002" stroke-width="4" stroke-linecap="round"/>
          <line x1="160" y1="20" x2="160" y2="50" stroke="#9a0002" stroke-width="4" stroke-linecap="round"/>

          <!-- Body Parts (Hidden initially, shown on wrong guess) -->
          <!-- 1. Head -->
          <circle id="part-head" class="body-part" cx="160" cy="75" r="22" fill="#ffffff" stroke="#9a0002" stroke-width="4"/>
          <!-- Face Eyes & Smile -->
          <g id="part-face" class="body-part">
            <line x1="152" y1="70" x2="158" y2="76" stroke="#9a0002" stroke-width="2.5"/>
            <line x1="158" y1="70" x2="152" y2="76" stroke="#9a0002" stroke-width="2.5"/>
            <line x1="162" y1="70" x2="168" y2="76" stroke="#9a0002" stroke-width="2.5"/>
            <line x1="168" y1="70" x2="162" y2="76" stroke="#9a0002" stroke-width="2.5"/>
            <path d="M 152 86 Q 160 80 168 86" stroke="#9a0002" stroke-width="2.5" fill="none"/>
          </g>

          <!-- 2. Body / Torso -->
          <line id="part-body" class="body-part" x1="160" y1="97" x2="160" y2="160" stroke="#9a0002" stroke-width="4" stroke-linecap="round"/>

          <!-- 3. Left Arm -->
          <line id="part-left-arm" class="body-part" x1="160" y1="115" x2="130" y2="140" stroke="#9a0002" stroke-width="4" stroke-linecap="round"/>

          <!-- 4. Right Arm -->
          <line id="part-right-arm" class="body-part" x1="160" y1="115" x2="190" y2="140" stroke="#9a0002" stroke-width="4" stroke-linecap="round"/>

          <!-- 5. Left Leg -->
          <line id="part-left-leg" class="body-part" x1="160" y1="160" x2="135" y2="200" stroke="#9a0002" stroke-width="4" stroke-linecap="round"/>

          <!-- 6. Right Leg -->
          <line id="part-right-leg" class="body-part" x1="160" y1="160" x2="185" y2="200" stroke="#9a0002" stroke-width="4" stroke-linecap="round"/>
        </svg>
      </div>

      <!-- Right: Word & Hint Display -->
      <div class="word-section">
        
        <div class="hint-container">
          <i class="fa-solid fa-lightbulb hint-icon"></i>
          <span id="hintText">Click "Hint" if you get stuck!</span>
          <button class="hint-btn" id="hintBtn" title="Get a hint">
            <i class="fa-solid fa-wand-magic-sparkles"></i> Hint
          </button>
        </div>

        <!-- Hidden Word Letter Containers -->
        <div class="word-display" id="wordDisplay">
          <!-- Dynamically populated via JS -->
        </div>

      </div>
    </div>

    <!-- On-screen Keyboard -->
    <div class="keyboard-container" id="keyboard">
      <!-- Generated via JS -->
    </div>

    <!-- Control Buttons -->
    <div class="controls-row">
      <button class="action-btn restart-btn" id="newWordBtn">
        <i class="fa-solid fa-rotate-right"></i> New Word
      </button>
      <button class="action-btn reset-score-btn" id="resetScoreBtn">
        <i class="fa-solid fa-arrow-rotate-left"></i> Reset Score
      </button>
    </div>

  </main>

  <!-- Result Modal (Win / Lose) -->
  <div class="modal" id="resultModal">
    <div class="modal-overlay"></div>
    <div class="modal-content">
      <div class="modal-icon" id="modalIcon">🎉</div>
      <h2 id="modalTitle">You Won!</h2>
      <p id="modalMessage">Great job guessing the word!</p>
      
      <div class="word-reveal-box">
        <span>The Secret Word was:</span>
        <strong id="revealedWord">HANGMAN</strong>
      </div>

      <div class="modal-buttons">
        <button class="action-btn modal-next-btn" id="modalNextBtn">
          <i class="fa-solid fa-play"></i> Next Word
        </button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
