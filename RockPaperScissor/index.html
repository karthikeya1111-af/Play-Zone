<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Document</title>
</head>
<body>
    <!-- PlayZone Home Button -->
    <a href="../index.html" class="playzone-home-btn" title="Back to PlayZone Home" style="position: fixed; top: 14px; right: 18px; z-index: 99999; background-color: #9a0002; color: #ffffff !important; padding: 8px 16px; border-radius: 30px; font-family: system-ui, -apple-system, sans-serif; font-weight: 700; font-size: 14px; text-decoration: none !important; display: inline-flex; align-items: center; gap: 6px; box-shadow: 0 4px 14px rgba(154, 0, 2, 0.35); border: 1.5px solid rgba(255, 255, 255, 0.3); transition: all 0.25s ease; line-height: 1;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
        <span>Home</span>
    </a>
    <div id="nav">
       <h1>Rock Paper And Scissors</h1>
    </div>
    <div id="battleArea">
    <div class="playerSide">
        <img id="userImg" src="gameImages/rockPlayer.png">
    </div>
    <div class="vs">
        <h2>VS</h2>
    </div>
    <div class="computerSide">
        <img id="compImg" src="gameImages/rockComputer.png">
    </div>
    </div>
    <div id="choices">
        <div class="choice" id="Rock">
            <p>Rock</p>
        </div>
         <div class="choice" id="Paper">
            <p>Paper</p>
        </div>
         <div class="choice" id="Scissor">
             <p>Scissor</p>
        </div>
    </div>
    <div id="scores">
     <div class="Marks">
            <p class="score" id="userScore">0</p>
            <p class="name">Companion</p>
        </div>

        <div class="Marks">
            <p class="score" id="compScore">0</p>
            <p class="name">Computer</p>
        </div>
    </div>
    <div id="Result">
        <p>
            Play Your Move
        </p>
    </div>
    <script src="script.js"></script>
