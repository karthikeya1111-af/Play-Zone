<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Snake & Ladder</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    background:#efe6dd;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
}

.container{
    display:flex;
    gap:40px;
    align-items:center;
}

.board{
    width:700px;
    height:700px;
    display:grid;
    grid-template-columns:repeat(10,1fr);
    grid-template-rows:repeat(10,1fr);
    border:8px solid #9a0002;
    border-radius:15px;
    overflow:hidden;
    position:relative;
    background:white;
}

.cell{
    border:1px solid #d8d8d8;
    display:flex;
    justify-content:center;
    align-items:center;
    font-weight:bold;
    color:#9a0002;
    position:relative;
}

.cell:nth-child(odd){
    background:#efe6dd;
}

.cell:nth-child(even){
    background:white;
}

.player1{
    width:18px;
    height:18px;
    border-radius:50%;
    background:#9a0002;
    position:absolute;
    bottom:6px;
    left:6px;
}

.player2{
    width:18px;
    height:18px;
    border-radius:50%;
    background:#2f8f2f;
    position:absolute;
    top:6px;
    right:6px;
}

svg{
    position:absolute;
    width:100%;
    height:100%;
    pointer-events:none;
}

.sidebar{
    width:250px;
}

.card{
    background:white;
    padding:20px;
    border-radius:15px;
    box-shadow:0 5px 20px rgba(0,0,0,.2);
}

h1{
    color:#9a0002;
    margin-bottom:20px;
    text-align:center;
}

.info{
    font-size:20px;
    margin:20px 0;
    color:#9a0002;
}

button{

    width:100%;
    padding:15px;
    margin-top:15px;
    border:none;
    border-radius:10px;
    background:#9a0002;
    color:#efe6dd;
    font-size:18px;
    cursor:pointer;
}

button:hover{
    background:#730002;
}

</style>

</head>

<body>

<div class="container">

<div class="board">

<!-- Snakes & Ladders -->

<svg viewBox="0 0 700 700">

<!-- Ladder -->

<line x1="110" y1="620" x2="250" y2="420"
stroke="brown"
stroke-width="8"/>

<line x1="130" y1="620" x2="270" y2="420"
stroke="brown"
stroke-width="8"/>

<line x1="110" y1="590" x2="130" y2="590"
stroke="brown"
stroke-width="5"/>

<line x1="145" y1="560" x2="165" y2="560"
stroke="brown"
stroke-width="5"/>

<line x1="180" y1="530" x2="200" y2="530"
stroke="brown"
stroke-width="5"/>

<line x1="215" y1="500" x2="235" y2="500"
stroke="brown"
stroke-width="5"/>

<!-- Snake -->

<path
d="M520 120
C600 180 470 220 560 290
C640 360 500 420 570 500"
stroke="green"
stroke-width="15"
fill="none"
stroke-linecap="round"/>

<circle
cx="520"
cy="120"
r="15"
fill="green"/>

</svg>

<script>

for(let i=100;i>=1;i--){

document.write(`
<div class="cell">

${i}

</div>
`);

}

</script>

</div>

<div class="sidebar">

<div class="card">

<h1>Snake & Ladder</h1>

<div class="info">

🔴 Player 1

</div>

<div class="info">

🟢 Player 2

</div>

<div class="info">

🎲 Dice : 1

</div>

<button>

Roll Dice

</button>

<button>

Restart

</button>

</div>

</div>

</div>

</body>
</html>
